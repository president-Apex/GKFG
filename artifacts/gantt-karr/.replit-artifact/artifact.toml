kind = "web"
previewPath = "/gantt-karr/"
title = "Gantt & Karr Formation Group"
version = "1.0.0"
id = "artifacts/gantt-karr"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/gantt-karr/" ]
localPort = 26072

[services.development]
run = "pnpm --filter @workspace/gantt-karr run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gantt-karr", "run", "build" ]
publicDir = "artifacts/gantt-karr/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26072"
BASE_PATH = "/gantt-karr/"
