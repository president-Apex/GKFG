kind = "video"
previewPath = "/gantt-key-promo/"
title = "Gantt Key Formation Group Promo Video"
version = "1.0.0"
id = "artifacts/gantt-key-promo"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/gantt-key-promo/" ]
localPort = 20596

[services.development]
run = "pnpm --filter @workspace/gantt-key-promo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gantt-key-promo", "run", "build" ]
publicDir = "artifacts/gantt-key-promo/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20596"
BASE_PATH = "/gantt-key-promo/"
